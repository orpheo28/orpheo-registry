provider_id: azure-speech
legal_entity: Microsoft Corporation
layer: transcription
jurisdiction: US
models: []

default_retention:
  value: "none in real time; Microsoft storage possible in batch processing"
  verified_at: 2026-08-13
  source_url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/speech-service/speech-to-text/data-privacy-security
  confidence: medium
  note: >
    TWO REGIMES IN THE SAME SERVICE, and that's the fact that matters.
    In REAL TIME: "Microsoft does not retain or store the data provided by
    customers"; "audio input is processed only on the Azure's server
    memory, and no data is stored at rest." Nothing to configure, nothing
    to request.
    In BATCH PROCESSING: the customer designates their own storage, but the
    resulting transcription "may be stored either in customer's own
    storage OR MICROSOFT STORAGE IF NO STORAGE IS SPECIFIED." In other
    words, specifying nothing lands the output at Microsoft — a default
    that bites, and that looks nothing like the real-time regime of the
    same service.
    Deletion is then driven by a dedicated API or the `timeToLive`
    parameter.
    ALSO WORTH NOTING: speaker separation (diarization, off by default)
    extracts unique voice characteristics, temporarily retained then
    "discarded." Microsoft states it doesn't enable enrollment or tracking
    a speaker across files.
    Documentation, non-contractual: confidence medium.

