baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://cloud.google.com/security/compliance/hipaa
  confidence: medium
  additional_source_urls:
    - https://cloud.google.com/terms/hipaa-baa
  note: >
    Speech-to-Text is explicitly listed among the products covered by the Google
    Cloud BAA, which « covers Google Cloud's entire infrastructure (all regions,
    all zones, all network paths, all points of presence) ».
    A CONDITION THAT CANCELS THE COVERAGE, and it is the decisive fact: « If you
    are using Cloud Speech-to-Text, and you have entered into a BAA with Google
    covering any PHI obligations under HIPAA, then you SHOULD NOT OPT INTO the
    data logging program. » One customer-side setting is therefore enough to
    leave the coverage — without changing provider, renegotiating anything, or
    receiving any signal.
    A second, general condition: the customer must ensure they do not use Google
    Cloud products that are not explicitly covered when working with PHI.
    Coverage is a list, not a state.
    The BAA itself is recorded as an additional source, so it is monitored too.
    This is a compliance page, not the contract: medium confidence.

