baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://cloud.google.com/security/compliance/hipaa
  confidence: medium
  additional_source_urls:
    - https://cloud.google.com/terms/hipaa-baa
  note: >
    Speech-to-Text is explicitly listed among the products covered by the
    Google Cloud BAA, which "covers Google Cloud's entire infrastructure
    (all regions, all zones, all network paths, all points of presence)."
    CONDITION THAT VOIDS COVERAGE, and it's the decisive fact: "If you are
    using Cloud Speech-to-Text, and you have entered into a BAA with Google
    covering any PHI obligations under HIPAA, then you SHOULD NOT OPT INTO
    the data logging program." A single client-side setting is therefore
    enough to fall out of coverage — without changing provider, without
    renegotiating anything, and without anything flagging it.
    Second, general condition: the customer must ensure they don't use
    Google Cloud products not explicitly covered with health data.
    Coverage is a list, not a state.
    The BAA itself is recorded as an additional source, so it's monitored.
    This page is a compliance page, not the contract: confidence medium.

