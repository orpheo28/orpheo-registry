provider_id: assemblyai
legal_entity: AssemblyAI Inc.
layer: transcription
jurisdiction: US
models: [universal, slam]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/legal/business-associate-agreement
  confidence: high
  note: >
    The BAA is PUBLISHED, in full, dated April 23, 2026 — one of the few
    indexed providers whose agreement can be read before it's requested,
    letting a buyer evaluate its terms without going through sales.
    Caveats from the document itself: it's a template, it only applies
    "only upon mutual execution," and signing it goes through the sales
    team. A published agreement isn't a signed one.
    It covers HIPAA and the HITECH Act.

dpa_eu:
  value: true
  verified_at: 2026-08-21
  source_url: https://www.assemblyai.com/legal/data-processing-addendum
  confidence: high
  note: >
    Published DPA dated January 22, 2026, grounded in GDPR, UK GDPR, Swiss
    law, and the standard contractual clauses of decision 2021/914 for
    transfers outside the EEA.
    USEFUL AND RARE DISTINCTION: the DPA excludes protected health
    information from its definition of personal data "to the extent the
    Parties have an effective BAA in place." The two agreements split the
    territory rather than overlapping — which means a healthcare buyer
    needs BOTH, and signing one doesn't cover what the other governs.
    ASSEMBLYAI ALSO RESERVES A CONTROLLER ROLE FOR ITSELF, EXPLICITLY — a
    nuance only re-checked across every dpa_eu entry after Twilio's DPA
    surfaced the same question (see METHODOLOGY.md, "Comparability across
    the matrix"). Section 13: "AssemblyAI is an independent controller, not
    a joint controller with Customer. AssemblyAI will process AssemblyAI
    Account Data and Usage Data as a controller (i) to manage the
    relationship with Customer; (ii) to carry out AssemblyAI's core
    business operations, such as accounting, audits, tax preparation and
    filing and compliance purposes; (iii) to monitor, investigate, prevent
    and detect fraud, security incidents and other misuse of the Services,
    and to prevent harm to Customer; (iv) for identity verification
    purposes; (v) to comply with legal or regulatory obligations...; and
    (vi) as otherwise permitted under Privacy Laws." Narrower than
    Mistral's controller purposes — no model-training clause here — but the
    same structural fact: "processor" isn't the whole story.

data_residency:
  value: [us, eu-dublin]
  holds_by_default: false
  verified_at: 2026-08-21
  source_url: https://www.assemblyai.com/security
  confidence: medium
  note: >
    "AssemblyAI processes data in our European data processing center in
    Dublin, Ireland. Customers can store and process their data within the
    United States or the European Union."
    The choice is self-service from the customer dashboard, with no
    negotiation required — which isn't the case everywhere.
    HOLDS_BY_DEFAULT IS FALSE: self-service is not the same as automatic.
    "Customers can... choose" still names a configuration step, even one
    with no sales conversation attached — that's what distinguishes this
    from a fourth occurrence of the enterprise-gated pattern, not from the
    action-required question this field asks.
    Security page, non-contractual: confidence medium.

# no_training_commitment — NOT DOCUMENTED
#   The security page says it stays "transparent on our data management
#   procedures, particularly related to ... training procedures." Announcing
#   transparency isn't making a commitment, and this registry publishes
#   commitments, not intentions.

