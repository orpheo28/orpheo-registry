provider_id: assemblyai
legal_entity: AssemblyAI Inc.
layer: transcription
jurisdiction: US
models: [universal, slam]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/legal/business-associate-agreement
  confidence: high
  note: >
    The BAA is PUBLISHED, in full, dated April 23, 2026 — one of the few
    indexed providers whose agreement can be read before it's requested,
    letting a buyer evaluate its terms without going through sales.
    Caveats from the document itself: it's a template, it only applies
    "only upon mutual execution," and signing it goes through the sales
    team. A published agreement isn't a signed one.
    It covers HIPAA and the HITECH Act.

dpa_eu:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/legal/data-processing-addendum
  confidence: high
  note: >
    Published DPA dated January 22, 2026, grounded in GDPR, UK GDPR, Swiss
    law, and the standard contractual clauses of decision 2021/914 for
    transfers outside the EEA.
    USEFUL AND RARE DISTINCTION: the DPA excludes protected health
    information from its definition of personal data "to the extent the
    Parties have an effective BAA in place." The two agreements split the
    territory rather than overlapping — which means a healthcare buyer
    needs BOTH, and signing one doesn't cover what the other governs.

data_residency:
  value: [us, eu-dublin]
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/security
  confidence: medium
  note: >
    "AssemblyAI processes data in our European data processing center in
    Dublin, Ireland. Customers can store and process their data within the
    United States or the European Union."
    The choice is self-service from the customer dashboard, with no
    negotiation required — which isn't the case everywhere.
    Security page, non-contractual: confidence medium.

