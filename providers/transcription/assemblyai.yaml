provider_id: assemblyai
legal_entity: AssemblyAI Inc.
layer: transcription
jurisdiction: US
models: [universal, slam]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/legal/business-associate-agreement
  confidence: high
  note: >
    Le BAA est PUBLIÉ, en toutes lettres, et daté du 23 avril 2026 — un des
    rares fournisseurs indexés dont l'accord se lit avant d'être demandé, ce qui
    permet à un éditeur d'en évaluer les termes sans passer par les ventes.
    Réserves du document lui-même : c'est un modèle, il ne s'applique
    « only upon mutual execution », et sa signature passe par l'équipe
    commerciale. Un accord publié n'est pas un accord signé.
    Il couvre HIPAA et le HITECH Act.

dpa_eu:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/legal/data-processing-addendum
  confidence: high
  note: >
    DPA publié et daté du 22 janvier 2026, adossé au RGPD, au RGPD britannique,
    à la loi suisse, et aux clauses contractuelles types de la décision 2021/914
    pour les transferts hors EEE.
    ARTICULATION UTILE, et rare : le DPA exclut de sa définition des données à
    caractère personnel les données de santé protégées « to the extent the
    Parties have an effective BAA in place ». Les deux accords se partagent donc
    le territoire au lieu de se recouvrir — ce qui veut dire qu'un éditeur santé
    a besoin des DEUX, et que signer l'un ne couvre pas ce que l'autre régit.

data_residency:
  value: [us, eu-dublin]
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/security
  confidence: medium
  note: >
    « AssemblyAI processes data in our European data processing center in
    Dublin, Ireland. Customers can store and process their data within the
    United States or the European Union. »
    Le choix est en libre-service depuis le tableau de bord client, sans passer
    par une négociation — ce qui n'est pas le cas partout.
    Page de sécurité, non contractuelle : confidence medium.

