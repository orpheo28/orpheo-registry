provider_id: assemblyai
legal_entity: AssemblyAI Inc.
layer: transcription
jurisdiction: US
models: [universal, slam]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/legal/business-associate-agreement
  confidence: high
  note: >
    The BAA is PUBLISHED in full and dated 23 April 2026 — one of the few
    providers indexed whose agreement can be read before it is requested, which
    lets an editor assess the terms without going through sales.
    Reservations stated by the document itself: it is a template, it applies
    « only upon mutual execution », and signing runs through the sales team. A
    published agreement is not a signed one.
    It covers HIPAA and the HITECH Act.

dpa_eu:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/legal/data-processing-addendum
  confidence: high
  note: >
    DPA published and dated 22 January 2026, built on the GDPR, the UK GDPR,
    Swiss law, and the standard contractual clauses of Decision 2021/914 for
    transfers outside the EEA.
    A USEFUL AND RARE ARTICULATION: the DPA excludes protected health information
    from its definition of personal data « to the extent the Parties have an
    effective BAA in place ». The two agreements divide the territory rather than
    overlap — which means a healthcare editor needs BOTH, and signing one does
    not cover what the other governs.

data_residency:
  value: [us, eu-dublin]
  verified_at: 2026-08-13
  source_url: https://www.assemblyai.com/security
  confidence: medium
  note: >
    « AssemblyAI processes data in our European data processing center in
    Dublin, Ireland. Customers can store and process their data within the
    United States or the European Union. »
    The choice is self-serve from the customer dashboard, without a negotiation —
    which is not the case everywhere.
    Security page, non-contractual: medium confidence.

