provider_id: speechmatics
legal_entity: Cantab Research Limited (Speechmatics)
layer: transcription
jurisdiction: GB
models: [ursa]

dpa_eu:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.speechmatics.com/legal/privacy-policy
  confidence: medium
  note: >
    "We enter into data processing agreements with our customers which set
    out our obligations under the GDPR," and, "where appropriate," the
    European Commission's standard contractual clauses for transfers
    outside the EEA, UK, or Switzerland. Speechmatics acts as processor,
    the customer as controller.
    The DPA itself hasn't been read: it's the privacy policy that attests
    to its existence, hence confidence medium.

# baa_available — NOT DOCUMENTED
#   A UK company; no first-party document read mentions a BAA in the HIPAA
#   sense. Absence of evidence, not evidence of absence.

# no_training_commitment — NOT DOCUMENTED, AND A TRAP NOT TO INVERT
#   Clause 4.3 of the terms of service prohibits THE CUSTOMER from using
#   the software to "create, train, or improve a similar or competing
#   product." That's a restriction imposed on the customer, NOT a
#   commitment from the provider not to train on customer data. Reading
#   the first as the second would invert the meaning of the contract.

# default_retention — NOT DOCUMENTED, TWO TRAPS AVOIDED
#   (1) The policy says it retains data "only as required or permitted by
#   local law and while it has a legitimate business purpose": that isn't a
#   duration, and publishing it as one would be inventing it.
#   (2) Clause 9.2 mentions seven days, but AFTER subscription
#   TERMINATION — not ongoing retention. Same trap as with Mistral.

data_residency:
  value: null
  holds_by_default: true
  verified_at: 2026-08-21
  source_url: https://www.speechmatics.com/legal/privacy-policy
  confidence: medium
  note: >
    VERIFIED AS ABSENT: the provider states the opposite of a guarantee.
    "The data that we collect from you may be stored and processed in a
    location outside of the European Economic Area, United Kingdom or
    Switzerland. For example, some of our third party cloud providers use
    servers that are located in the USA."
    This isn't an unknown, it's an answer — and it's the one a European
    buyer needs to see before choosing a UK-based transcriber.
    CHAIN: the published sub-processor list names Alphabet/Google for
    "document and communication storage" and "generative AI." A buyer who
    thinks they're only using a UK provider actually has a US actor in
    their chain, which the document states itself.
    HOLDS_BY_DEFAULT IS TRUE FOR THE RECORDED VALUE (null): unlike
    OpenRouter, no narrower opt-in mechanism is documented anywhere in this
    page — the absence of a guarantee is simply the unconditional state, as
    far as this source goes.
