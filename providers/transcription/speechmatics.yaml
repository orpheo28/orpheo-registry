dpa_eu:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.speechmatics.com/legal/privacy-policy
  confidence: medium
  note: >
    « We enter into data processing agreements with our customers which set out
    our obligations under the GDPR », and, « where appropriate », the European
    Commission's standard contractual clauses for transfers outside the EEA, the
    UK or Switzerland. Speechmatics acts as processor, the customer as controller.
    The DPA itself has not been read: the privacy policy attests to its existence,
    hence medium confidence.

data_residency:
  value: null
  verified_at: 2026-08-13
  source_url: https://www.speechmatics.com/legal/privacy-policy
  confidence: medium
  note: >
    RECORDED AS VERIFIABLY ABSENT: the provider states the opposite of a
    guarantee. « The data that we collect from you may be stored and processed in
    a location outside of the European Economic Area, United Kingdom or
    Switzerland. For example, some of our third party cloud providers use servers
    that are located in the USA. »
    This is not an unknown, it is an answer — and it is the one a European editor
    needs before choosing a British transcription provider.
    CHAIN: the published subprocessor list names Alphabet/Google for « document
    and communication storage » and « generative AI ». An editor who believes
    they use only a British provider in fact has a US company in their chain,
    which the document says itself.

# baa_available — NOT RECORDED
#   British company; no first-party document read mentions a HIPAA BAA. Absence
#   of evidence, not evidence of absence.

# no_training_commitment — NOT RECORDED, AND A TRAP NOT TO INVERT
#   Clause 4.3 of the terms of service forbids THE CUSTOMER from using the
#   software to « create, train, or improve a similar or competing product ».
#   That is a restriction imposed on the customer, NOT a commitment by the
#   provider not to train on customer data. Reading the first as the second would
#   invert the contract.

# default_retention — NOT RECORDED, TWO TRAPS AVOIDED
#   (1) The policy says data is retained « only as required or permitted by local
#   law and while it has a legitimate business purpose »: that is not a duration,
#   and publishing it as one would be inventing.
#   (2) Clause 9.2 mentions seven days, but AFTER TERMINATION of the subscription
#   — not routine retention. Same trap as Mistral's thirty days.
