provider_id: deepgram
legal_entity: Deepgram, Inc.
layer: transcription
jurisdiction: US
models: [nova, whisper]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://developers.deepgram.com/trust-security/data-privacy-compliance
  confidence: medium
  note: >
    "We can provide our Business Associate Agreement to such customers upon
    request" — on request, and for customers who self-qualify as a Covered
    Entity under HIPAA. Deepgram positions itself as a Business Associate.
    This isn't a self-service agreement: it has to be requested, so the
    lead time has to be planned for. Documentation page, not the contract
    itself, hence confidence medium.

data_residency:
  value: [eu, au-sydney]
  verified_at: 2026-08-13
  source_url: https://developers.deepgram.com/trust-security/data-privacy-compliance
  confidence: medium
  note: >
    Dedicated regional endpoints: `api.eu.deepgram.com` for processing
    within the European Union, `api.au.deepgram.com` for Australia — the
    latter "runs exclusively on Australian infrastructure (AWS
    ap-southeast-2, Sydney). Storage and inference both happen in-country —
    not storage alone." The storage/inference distinction is made
    explicitly, which is rare.
    CHAIN BREAK DOCUMENTED BY THE PROVIDER ITSELF, and it's the single most
    useful fact on this page: for Voice Agent customers, Deepgram runs
    `listen` and `speak` on Australian infrastructure, but the `think` step
    runs "on the third-party provider's infrastructure, which may process
    data outside Australia." The residency guarantee therefore covers two
    links out of three, and Deepgram writes that it's up to the customer
    to check the third. A buyer who reads "Australian residency" and stops
    there has a broken chain without knowing it.

# no_training_commitment — NOT DOCUMENTED, AND THE QUESTION IS OPEN
#   The page establishes that a model-improvement program exists and that
#   you can opt out of it with a parameter — `mip_opt_out=true` — but it
#   never states the DEFAULT state on the ordinary endpoints. An opt-out
#   that exists suggests the opposite default; assuming that would still be
#   inference, not verification. It's the first question to ask Deepgram,
#   and it beats a fact invented in either direction.

# zero_retention_option — NOT DOCUMENTED
#   No first-party source read.

# default_retention — NOT DOCUMENTED
#   No first-party source read.

# dpa_eu — NOT DOCUMENTED
#   The page claims to be "GDPR ready" — a compliance claim, which this
#   registry doesn't publish (INV-4), and which isn't the same as making a
#   signable agreement available. A DPA is mentioned, but an AUSTRALIAN one,
#   on request; nothing establishes a European equivalent exists.
