layer: transcription
jurisdiction: US
models: [nova, whisper]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://developers.deepgram.com/trust-security/data-privacy-compliance
  confidence: medium
  note: >
    « We can provide our Business Associate Agreement to such customers upon
    request » — on request, and for customers who qualify as a Covered Entity
    under HIPAA. Deepgram presents itself as a Business Associate.
    This is not a self-serve agreement: it must be asked for, so the lead time
    must be planned. Documentation page, not the contract, hence medium.

data_residency:
  value: [eu, au-sydney]
  verified_at: 2026-08-13
  source_url: https://developers.deepgram.com/trust-security/data-privacy-compliance
  confidence: medium
  note: >
    Dedicated regional endpoints: `api.eu.deepgram.com` for processing in the
    European Union, `api.au.deepgram.com` for Australia — the latter « runs
    exclusively on Australian infrastructure (AWS ap-southeast-2, Sydney).
    Storage and inference both happen in-country — not storage alone. » The
    storage/inference distinction is made explicitly, which is rare.
    CHAIN BREAK, DOCUMENTED BY THE PROVIDER ITSELF, and the most useful fact on
    this page: for Voice Agent customers, Deepgram runs `listen` and `speak` on
    Australian infrastructure, but the `think` step runs « on the third-party
    provider's infrastructure, which may process data outside Australia ». The
    residency guarantee therefore covers two links out of three, and Deepgram
    writes that verifying the third is the customer's job. An editor who reads
    « Australian residency » and stops there has a broken chain and no signal.

# no_training_commitment — NOT RECORDED, AND THE QUESTION IS OPEN
#   The page establishes that a model improvement programme exists and can be
