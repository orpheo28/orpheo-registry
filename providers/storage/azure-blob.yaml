# dpa_eu — NOT RECORDED, THOUGH THE PAGE NAMES THE DOCUMENT
#   The BAA fact above cites the « Microsoft Online Services Data Protection
#   Addendum » — which is precisely the European processing agreement. Naming a
#   document is not reading it: the DPA itself was not opened, and recording
