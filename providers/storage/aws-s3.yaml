provider_id: aws-s3
legal_entity: Amazon Web Services, Inc.
layer: storage
jurisdiction: US
models: []

baa_available:
  value: true
  verified_at: 2026-08-21
  source_url: https://aws.amazon.com/compliance/hipaa-eligible-services-reference/
  confidence: medium
  additional_source_urls:
    - https://aws.amazon.com/compliance/hipaa-compliance/
  note: >
    Amazon S3 is named explicitly in the list of HIPAA-eligible services:
    "Amazon Simple Storage Service (S3)." The same page carries the
    condition of use: "you agree not to use these HIPAA Eligible Services
    for any purpose or in any manner involving Protected Health Information
    without first entering into an AWS business associate agreement" —
    eligibility covers nothing until the agreement is signed.
    THE MECHANISM IS SELF-SERVICE, NOT AN ASSISTED SALE: the HIPAA
    Compliance page states "To review, accept, and manage the status of
    the BAA for your account, sign in to AWS Artifact in the AWS
    Management Console" — no indication of a reserved account tier.
    This page is a compliance reference published by AWS, not the contract
    itself: hence confidence medium — the same reading as on
    aws-bedrock.yaml, for the same page.

dpa_eu:
  value: true
  verified_at: 2026-08-21
  source_url: https://aws.amazon.com/service-terms/
  confidence: high
  note: >
    Section 1.14.1 of the AWS Service Terms, in the main text: "These
    Service Terms incorporate the AWS Data Processing Addendum ('DPA'),
    when you use AWS Services to process Customer Data." S3 processes
    customer data by construction — it's a storage service — so the DPA
    applies. Contractual document, hence confidence high.
    CONTROLLER-ROLE QUESTION RE-CHECKED, AND THE ANSWER HERE IS "NOT IN
    THIS SECTION" — after Twilio's DPA surfaced it, then re-asked across
    every dpa_eu entry (see METHODOLOGY.md, "Comparability across the
    matrix"). Section 1.14 itself is a pure incorporation-by-reference
    clause and names no controller purpose for AWS. Elsewhere in the same
    Service Terms, though, AWS does reserve service-improvement uses that
    read as controller-like: section 1.20, "We may use information about
    how you use and interact with the Services to improve those Services,"
    and section 8.1, on CloudWatch Metric Data, "may be used by AWS to
    develop and improve the Services." Neither clause uses the word
    "Controller," and neither is inside the DPA-incorporation section
    itself — so this isn't recorded as equivalent to Mistral's or
    AssemblyAI's explicit "as Controller" language, but it isn't silence
    either. Worth a second look at the DPA document itself (not yet read),
    which may state this more precisely than the general Service Terms do.

data_residency:
  value: [fr, de, ie, it, es, se, ch, uk]
  holds_by_default: false
  verified_at: 2026-08-21
  source_url: https://aws.amazon.com/compliance/eu-data-protection/
  confidence: medium
  note: >
    Main text of the page: "You can choose to store your customer data in
    any one or more of our European Regions, including EU Regions in
    France, Germany, Ireland, Italy, Spain, and Sweden," and separately
    names Switzerland and the UK as storage options.
    HOLDS_BY_DEFAULT IS FALSE: "you can choose" is the source's own frame
    — this residency follows from an affirmative selection, not from
    default behavior of the service.
    THE LIST IS NOT DECLARED EXHAUSTIVE BY THE SOURCE ITSELF: the word
    "including" is AWS's, not caution added here. AWS operates regions
    outside these eight countries (Asia-Pacific, North and South America,
    Middle East, Africa); this value covers ONLY what this page names in
    its main text, not the full list of AWS regions — no first-party page
    listing that full list, in main text and with per-country region
    precision, has been read.
    Public, non-contractual documentation page, hence confidence medium.

# no_training_commitment — NOT DOCUMENTED
#   S3 is a storage service, not a model: the very notion of a no-training
#   commitment has no documented object at this level. No first-party
#   source read states it for this service.

# zero_retention_option — NOT DOCUMENTED
#   S3's role is to retain whatever is deposited until the customer deletes
#   it: a "zero-retention option" isn't a concept that applies as-is to a
#   storage service. No first-party source read states it in these terms
#   for S3.

# default_retention — NOT DOCUMENTED
#   For the same reason: an S3 object's default retention is whatever the
#   customer chooses (indefinite unless deleted, or a lifecycle policy they
#   configure themselves) — it isn't a period set by AWS the way it is at a
#   provider that processes then erases. No first-party source read states
#   a default period for S3.
