service_name: "Scaleway Generative APIs"
entity: scaleway
entity_name: "Scaleway"
layer: model
models: [llama, mistral, qwen]

zero_retention_option:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    DISTINCTIVE: zero retention is the DEFAULT here, not an option to request or
    have approved — « By default we apply a Zero Data Retention Policy ». This is
    the only provider indexed so far in that position.
    Prompt content is not collected: telemetry covers request metadata, token
    counts and parameters, « excluding the actual content of the prompts ».
    DOCUMENTED EXCEPTION: where usage harms the service — the example given is an
    HTTP 500 error — the full content of that customer's requests may be stored
    temporarily, for up to two weeks, for investigation.
    This page is a service privacy policy; the contractual document is the
    « Specific Conditions AI Services » PDF, not read.

default_retention:
  value: "none by default"
  verified_at: 2026-08-13
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    Corollary of the zero-retention default: prompt content is not kept. Except
    for the investigation case described above, bounded at two weeks.

data_residency:
  value: [paris-fr]
  verified_at: 2026-08-13
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    Exact wording: « Your personal data may be stored in the following region:
    Paris, France. » Scaleway states it hosts the models on its own European
    infrastructure, « without interaction with third-party services ».

