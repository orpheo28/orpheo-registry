provider_id: scaleway
legal_entity: Scaleway SAS
layer: model
jurisdiction: FR
models: [llama, mistral, qwen]

zero_retention_option:
  value: true
  holds_by_default: true
  verified_at: 2026-08-21
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    NOTABLE: zero retention is the DEFAULT here, not an option to request or
    get approved — "By default we apply a Zero Data Retention Policy." It's
    the only provider indexed so far in that position.
    Prompt content isn't collected: telemetry covers request metadata,
    token counts, and parameters, "excluding the actual content of the
    prompts."
    DOCUMENTED EXCEPTION: in case of usage harmful to the service — the
    example given is an HTTP 500 error — the full content of that
    customer's requests may be stored temporarily, for up to two weeks, for
    investigation.
    This page is a service privacy policy; the contractual document is the
    "Specific Conditions AI Services" PDF, not read.

default_retention:
  value: "none by default"
  verified_at: 2026-08-13
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    Corollary of the zero-retention-by-default policy: prompt content isn't
    kept. Except for the investigation exception described above, capped at
    two weeks.

data_residency:
  value: [paris-fr]
  holds_by_default: true
  verified_at: 2026-08-21
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    Exact wording: "Your personal data may be stored in the following
    region: Paris, France." Scaleway states it hosts the models on its own
    infrastructure in Europe, "without interaction with third-party
    services."
    HOLDS_BY_DEFAULT IS TRUE: unlike Azure, AWS, or OpenAI, nothing in this
    page frames Paris as a customer-selected region among several — it
    reads as simply where Scaleway runs, with no selection step named.

# baa_available — NOT DOCUMENTED
#   No first-party document read mentions a BAA. Absence of evidence, not
#   evidence of absence.

# no_training_commitment — NOT DOCUMENTED
#   The page read describes collection, not a no-training commitment. Don't
#   infer one from the other: not collecting prompt content and making a
#   contractual commitment not to train on it are two distinct facts, and
#   it's the second one the matrix displays.

# dpa_eu — NOT DOCUMENTED
#   The page asserts GDPR compliance. This registry doesn't publish
#   compliance claims (INV-4), and an asserted compliance isn't the same as
#   making a signable data processing agreement available. Scaleway's DPA
#   probably exists in its contracts; it hasn't been read.
