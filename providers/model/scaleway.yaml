provider_id: scaleway
legal_entity: Scaleway SAS
layer: model
jurisdiction: FR
models: [llama, mistral, qwen]

zero_retention_option:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    PARTICULARITÉ : la rétention nulle est le DÉFAUT, pas une option à demander
    ni à faire approuver — « By default we apply a Zero Data Retention Policy ».
    C'est le seul fournisseur indexé à ce jour dans ce cas.
    Le contenu des prompts n'est pas collecté : la télémétrie porte sur les
    métadonnées de requête, le décompte de jetons et les paramètres,
    « excluding the actual content of the prompts ».
    EXCEPTION DOCUMENTÉE : en cas d'usage nuisant au service — l'exemple donné
    est une erreur HTTP 500 — le contenu complet des requêtes de ce client peut
    être stocké temporairement, jusqu'à deux semaines, pour investigation.
    Cette page est une politique de confidentialité de service ; le document
    contractuel est le PDF « Specific Conditions AI Services », non lu.

default_retention:
  value: "aucune par défaut"
  verified_at: 2026-08-13
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    Corollaire de la politique de rétention nulle par défaut : le contenu des
    prompts n'est pas conservé. Sauf l'exception d'investigation décrite
    ci-dessus, bornée à deux semaines.

data_residency:
  value: [paris-fr]
  verified_at: 2026-08-13
  source_url: https://www.scaleway.com/en/docs/generative-apis/reference-content/data-privacy/
  confidence: medium
  note: >
    Formulation exacte : « Your personal data may be stored in the following
    region: Paris, France. » Scaleway indique héberger les modèles sur sa
    propre infrastructure en Europe, « without interaction with third-party
    services ».

