models: [gemini-3-pro, gemini-3-flash]

no_training_commitment:
  value: true
  holds_by_default: true
  verified_at: 2026-08-21
  source_url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
  confidence: medium
  note: >
    Exact wording: "Google won't use your data to train or fine-tune any
    AI/ML models without your prior permission or instruction. This applies
    to all managed models, including GA and pre-GA models."
    NUANCE: conditional, as with Microsoft — "without your prior permission
    or instruction" — but, as with Microsoft, the conditional runs the
    OTHER way: it's Google who'd need the customer's permission to train,
    not the reverse. Nothing for the customer to configure, hence
    HOLDS_BY_DEFAULT IS TRUE.
    For the contractual clause, this page points to the "Training
    Restriction" section of the Service Specific Terms. That document
    hasn't been read: confidence therefore stays medium, and a reviewer who
    wants high will need to cite the Service Specific Terms directly.

zero_retention_option:
  value: true
  holds_by_default: false
  verified_at: 2026-08-21
  source_url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
  confidence: medium
  note: >
    Zero data retention is NOT a default state or a single switch: "To
    achieve zero data retention, customers must take specific actions
    within each of these areas." Several areas are covered separately,
    including prompt logging for abuse monitoring, Live API session resume,
    and in-memory caching.
    A buyer who thinks they enabled ZDR with one action hasn't.

