no_training_commitment:
  value: true
  verified_at: 2026-08-13
  source_url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
  confidence: medium
  note: >
    Exact wording: « Google won't use your data to train or fine-tune any AI/ML
    models without your prior permission or instruction. This applies to all
    managed models, including GA and pre-GA models. »
    THE QUALIFIER MATTERS, as with Microsoft: conditional — « without your prior
    permission or instruction ».
    For the contractual clause, this page points to the « Training Restriction »
    section of the Service Specific Terms. That document has not been read, so
    confidence stays medium; a reviewer wanting high must cite the Service
    Specific Terms directly.

zero_retention_option:
  value: true
  verified_at: 2026-08-13
  source_url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
  confidence: medium
  note: >
    Zero retention is neither a default state nor a single switch: « To achieve
    zero data retention, customers must take specific actions within each of
    these areas. » Several areas are handled separately, including prompt logging
    for abuse monitoring, Live API session resumption, and in-memory caching.
    An editor who believes one action enabled ZDR has not enabled it.

