provider_id: ovhcloud
legal_entity: OVH Groupe SA
layer: model
jurisdiction: FR
models: [llama, qwen, deepseek]

no_training_commitment:
  value: true
  holds_by_default: true
  verified_at: 2026-08-21
  source_url: https://www.ovhcloud.com/en/public-cloud/ai-endpoints/
  confidence: medium
  note: >
    Exact wording, on the AI Endpoints product page: "Your data will never
    be used to train or improve our AI models."
    AMBIGUITY TO RESOLVE: OVHcloud serves THIRD-PARTY models — Llama, Qwen,
    Deepseek. "our AI models" therefore doesn't explicitly say what happens
    to data with respect to the publishers of those models, or whether the
    commitment covers the whole chain. A healthcare buyer needs that
    precision, and this source doesn't give it.
    It's also a product page, not a contractual document: the AI Endpoints
    specific terms haven't been read, hence confidence medium.
    HOLDS_BY_DEFAULT IS TRUE: the statement is flat and unconditional —
    "never," no opt-out, no configuration, no plan tier named.

# baa_available — NOT DOCUMENTED
