no_training_commitment:
  value: true
  verified_at: 2026-08-13
  source_url: https://www.ovhcloud.com/en/public-cloud/ai-endpoints/
  confidence: medium
  note: >
    Exact wording, on the AI Endpoints product page: « Your data will never be
    used to train or improve our AI models ».
    AMBIGUITY TO RESOLVE: OVHcloud serves THIRD-PARTY models — Llama, Qwen,
    Deepseek. « our AI models » therefore does not state what happens to the data
    with respect to those models' publishers, nor whether the commitment covers
    the whole chain. A healthcare editor needs that precision, and this source
    does not give it.
    It is also a product page rather than a contractual document: the AI
    Endpoints specific conditions have not been read, hence medium confidence.

