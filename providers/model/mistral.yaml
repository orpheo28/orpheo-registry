provider_id: mistral
legal_entity: Mistral AI SAS
layer: model
jurisdiction: FR
models: [mistral-large, mistral-small, codestral]

no_training_commitment:
  value: true
  verified_at: 2026-08-13
  source_url: https://legal.mistral.ai/terms/commercial-terms-of-service
  confidence: high
  note: >
    Section 4.2 of the Commercial Terms of Service — a contractual document.
    The commitment is real but carries FOUR exceptions, one of which reverses
    the burden: « except (a) when you (i) opted-in to training on a Mistral AI
    Product set to opt-out by default or (ii) HAVE NOT OPTED-OUT of training on
    a Mistral AI Product SET TO OPT-IN BY DEFAULT ».
    In other words, some products train BY DEFAULT and you must act to stop it.
    The three other exceptions: Feedback provided to Mistral, whatever an Order
    Form provides, and Labs or Preview models.
    The licence granted for operating the service explicitly excludes model
    training (section 4.1).

zero_retention_option:
  value: true
  verified_at: 2026-08-13
  source_url: https://legal.mistral.ai/terms/data-processing-addendum
  confidence: high
  note: >
    Established by the DPA, which describes automated moderation « including
    abuse monitoring on our APIs (except, in this last case, when zero data
    retention has been activated) »: enabling ZDR removes calls from abuse
    monitoring.
    DOCUMENTED CONFLICT, section 4.3 of the Commercial Terms: « the opt-out
    preferences you selected for other Mistral AI Products (including through
    zero data retention) DOES NOT APPLY to Labs or Preview Models », and data
    from those models may be used for training. An editor who enabled ZDR and
    then tries a « labs » model is no longer covered.
    The source establishes neither the exact set of eligible APIs nor whether
    approval is required: both remain unknown.

dpa_eu:
  value: true
  verified_at: 2026-08-13
  source_url: https://legal.mistral.ai/terms/data-processing-addendum
  confidence: high
  note: >
    Published, contractual DPA, built on the GDPR (Regulation EU 2016/679), on
    the standard contractual clauses of Implementing Decision 2021/914, and on
    European Commission adequacy decisions. Transfers outside the EEA are
    governed by those same clauses.

# baa_available — NOT RECORDED
#   A BAA is an instrument of US federal law (HIPAA). No first-party document
#   read mentions Mistral offering one. ABSENCE OF EVIDENCE, NOT EVIDENCE OF
#   ABSENCE: do not write `false`, which would claim we verified there is none.

# default_retention — NOT RECORDED
#   TRAP AVOIDED, recorded so nobody falls into it: the DPA does mention thirty
#   days, but for deletion AFTER TERMINATION — « the Personal Data will no longer
#   be accessible upon the expiry of a thirty (30) days period following the
#   termination of the Customer's access ». That is not routine prompt retention,
#   and conflating the two would publish a false fact with a real source.

# data_residency — NOT RECORDED
#   The DPA governs TRANSFERS; it does not guarantee a processing region. No
#   first-party source read establishes residency.
