provider_id: mistral
legal_entity: Mistral AI SAS
layer: model
jurisdiction: FR
models: [mistral-large, mistral-small, codestral]

no_training_commitment:
  value: true
  holds_by_default: null
  verified_at: 2026-08-21
  source_url: https://legal.mistral.ai/terms/commercial-terms-of-service
  confidence: high
  note: >
    Section 4.2 of the Commercial Terms of Service — a contractual document.
    The commitment is real but carries FOUR exceptions, one of which flips
    the burden: "except (a) when you (i) opted-in to training on a Mistral
    AI Product set to opt-out by default or (ii) HAVE NOT OPTED-OUT of
    training on a Mistral AI Product SET TO OPT-IN BY DEFAULT."
    In other words, some products train BY DEFAULT and you have to act to
    opt out. The other three exceptions: feedback you submit, whatever a
    purchase order provides, and Labs or Preview models.
    The license granted to run the service also explicitly excludes
    training (section 4.1).
    HOLDS_BY_DEFAULT IS NULL, NOT A GUESS EITHER WAY: the clause itself
    splits by product between opt-out-by-default (commitment holds without
    action) and opt-in-by-default (action required) — the source names
    both categories without stating which one is most of the surface.
    Answering true or false here would mean inferring a majority the
    document doesn't state, which is exactly the interpretation this field
    exists to refuse.

zero_retention_option:
  value: true
  holds_by_default: null
  verified_at: 2026-08-21
  source_url: https://legal.mistral.ai/terms/data-processing-addendum
  confidence: high
  note: >
    Established by the DPA, which describes automated moderation "including
    abuse monitoring on our APIs (except, in this last case, when zero data
    retention has been activated)": enabling ZDR therefore exempts calls
    from abuse monitoring.
    DOCUMENTED CONFLICT, section 4.3 of the Commercial Terms: "the opt-out
    preferences you selected for other Mistral AI Products (including
    through zero data retention) DOES NOT APPLY to Labs or Preview Models,"
    and data from those models can be used for training. A buyer who has
    enabled ZDR and tries a "labs" model is no longer covered.
    The source establishes neither the exact scope of eligible APIs nor
    whether approval is required: both remain unknown — hence
    HOLDS_BY_DEFAULT IS NULL, stated by the source's own silence on this
    point, not assumed.

dpa_eu:
  value: true
  verified_at: 2026-08-21
  source_url: https://legal.mistral.ai/terms/data-processing-addendum
  confidence: high
  note: >
    Published, contractual DPA, grounded in GDPR (EU Regulation 2016/679),
    the standard contractual clauses of implementing decision 2021/914, and
    the European Commission's adequacy decisions. Transfers outside the EEA
    are governed by these same clauses.
    MISTRAL RESERVES A CONTROLLER ROLE FOR ITSELF, EXPLICITLY — a nuance
    only re-checked across every dpa_eu entry after Twilio's DPA surfaced
    the same question (see METHODOLOGY.md, "Comparability across the
    matrix"). Section 2.3: "Mistral AI is authorized to process the
    Personal Data as Controller for the purposes of:" (1) "Training its
    artificial intelligence models in accordance with its Privacy Policy,
    unless Customer is or has opted-out of training"; (2) "Automated
    moderation, including abuse monitoring on our APIs..."; (3) "Processing
    usage and operational data...to produce aggregated or anonymized data
    or statistics...for Mistral AI's business purposes, including
    conducting research, developing or improving Mistral AI Products." The
    first purpose ties directly back to no_training_commitment above: the
    DPA's own controller clause is where that opt-out mechanism is rooted.

# baa_available — NOT DOCUMENTED
#   A BAA is a US federal-law instrument (HIPAA). No first-party document
#   read mentions that Mistral offers one. ABSENCE OF EVIDENCE, NOT EVIDENCE
#   OF ABSENCE: don't write `false`, which would assert we verified there
#   isn't one.

# default_retention — NOT DOCUMENTED
#   TRAP AVOIDED, and not to be fallen into again: the DPA does mention a
#   thirty-day period, but it covers deletion AFTER TERMINATION — "the
#   Personal Data will no longer be accessible upon the expiry of a thirty
#   (30) days period following the termination of the Customer's access."
#   That isn't ongoing prompt retention, and conflating the two would
#   publish a false fact backed by a real source.

# data_residency — NOT DOCUMENTED
#   The DPA governs TRANSFERS; it doesn't guarantee a processing region. No
#   first-party source read establishes residency.
