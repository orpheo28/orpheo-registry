provider_id: anthropic
legal_entity: Anthropic PBC
layer: model
jurisdiction: US
models: [claude-opus-5, claude-sonnet-5, claude-haiku-4-5]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://privacy.claude.com/en/articles/8114513-business-associate-agreements-baa-for-commercial-customers
  confidence: high
  note: >
    First-party API and Enterprise plans only. The Primary Owner must enable
    HIPAA compliance and accept the BAA; a standard Enterprise plan isn't
    covered without that action. Excluded: Workbench, Console, Free, Pro,
    Max, Team, and beta features. Not every API function is covered.

default_retention:
  value: "30 days"
  verified_at: 2026-08-13
  source_url: https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data
  confidence: high
  note: >
    Inputs and outputs are automatically deleted within 30 days. Exceptions:
    services with longer, customer-controlled retention (Files API), a
    contrary agreement, or enforcement of the Usage Policy.

zero_retention_option:
  value: true
  verified_at: 2026-08-13
  source_url: https://privacy.claude.com/en/articles/8956058-i-have-a-zero-data-retention-agreement-with-anthropic-what-products-does-it-apply-to
  confidence: high
  note: >
    Subject to Anthropic's approval. Applies to eligible APIs and to products
    using the commercial organization's key. Safety classifier outputs are
    still retained.
    DOCUMENTED CONFLICT: Covered Models require 30 days of retention and
    aren't available with ZDR enabled. The source of this conflict is
    recorded in additional_source_urls, so it's monitored like any other.
  additional_source_urls:
    - https://platform.claude.com/docs/en/manage-claude/api-and-data-retention

