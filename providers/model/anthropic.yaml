legal_entity:
  value:
    - scope: "EEA, Switzerland, UK"
      entity: "Anthropic Ireland, Limited"
      jurisdiction: IE
    - scope: "elsewhere"
      entity: "Anthropic, PBC"
      jurisdiction: US
  verified_at: 2026-08-13
  source_url: https://www.anthropic.com/legal/commercial-terms
  confidence: high
  quote: '"Anthropic" means Anthropic Ireland, Limited if Customer resides in the European Economic Area ("EEA"), Switzerland or UK, and Anthropic, PBC if Customer resides anywhere else.'
  note: >
    « "Anthropic" means Anthropic Ireland, Limited if Customer resides in the
    European Economic Area ("EEA"), Switzerland or UK, and Anthropic, PBC if
    Customer resides anywhere else. »
    THE SIGNING ENTITY DEPENDS ON WHERE THE CUSTOMER IS, so the governing
    jurisdiction does too. A European editor does not contract with a US company
    here, and a US editor does not contract with an Irish one. Any single value
    in this field would be wrong for one of them.
