provider_id: openai
legal_entity: OpenAI OpCo, LLC
layer: model
jurisdiction: US
models: [gpt-5.2, gpt-5.2-mini, o4]

baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://help.openai.com/en/articles/8660679-how-can-i-get-a-business-associate-agreement-baa-with-openai
  confidence: high
  note: >
    Signable BAA for the API Platform and ChatGPT for Healthcare. An
    enterprise agreement is NOT required to sign an API BAA — unlike ChatGPT
    Enterprise/Edu, reserved for sales-managed accounts. ChatGPT Business
    isn't eligible.
    Web search with direct internet access is NOT HIPAA-eligible and isn't
    covered by the BAA; in cache-only mode it is, but only with a key from
    a ZDR project in a ZDR organization.
    SOURCE CHANGED on 2026-08-13: the fact did appear on
    openai.com/enterprise-privacy, but behind a collapsed FAQ — so not
    re-verifiable by a third party without interacting with the page. The
    source now on record is the one that states it in the main text.

no_training_commitment:
  value: true
  holds_by_default: true
  verified_at: 2026-08-21
  source_url: https://openai.com/enterprise-privacy/
  confidence: high
  note: >
    Data submitted through the API, ChatGPT Enterprise, and ChatGPT Team
    isn't used to train the models — stated directly in the page's main
    text. Consumer tiers (Free, Plus) have a different default and aren't
    covered by this.
    HOLDS_BY_DEFAULT IS TRUE: for the covered tiers, the commitment is
    unconditional in the page's own text — no opt-out, no approval, no
    configuration named anywhere in this passage.

default_retention:
  value: "30 days"
  verified_at: 2026-08-13
  source_url: https://openai.com/enterprise-privacy/
  confidence: high
  note: >
    Retention of up to 30 days for service delivery and abuse detection,
    except for excluded endpoints and features listed in the platform
    documentation. Deleted after 30 days unless legally required otherwise.

zero_retention_option:
  value: true
  holds_by_default: false
  verified_at: 2026-08-21
  source_url: https://developers.openai.com/api/docs/guides/your-data
  confidence: high
  note: >
    ZDR on eligible endpoints, subject to approval and a qualifying use
    case. Configurable at the organization and project level.
    PUBLISHED RESERVATION: OpenAI reserves the right to make a model
    ineligible for ZDR for a given customer in case of a severe-risk
    investigation, with prior written notice.

data_residency:
  value: [us, eu, uk, jp, ca, kr, sg, au, in, ae]
  holds_by_default: null
  verified_at: 2026-08-21
  source_url: https://openai.com/business-data/
  confidence: high
  note: >
    Residency AT REST in these regions for eligible customers. In addition,
    in-region GPU inference is available in the US and Europe; API
    customers can explicitly select US or Europe for processing (GPU and
    non-GPU inference) on supported endpoints.
    HOLDS_BY_DEFAULT IS NULL: the AT-REST list applies "for eligible
    customers" — an eligibility gate, not clearly a self-service default —
    while the region SELECTION for processing is explicitly something the
    customer does ("can explicitly select"). The page doesn't say what an
    ordinary customer gets with no eligibility check and no selection, so
    recording true or false here would fill a gap the source leaves open.

dpa_eu:
  value: true
  verified_at: 2026-08-21
  source_url: https://cdn.openai.com/pdf/openai-data-processing-addendum.pdf
  confidence: high
  note: >
    SOURCE CHANGED on 2026-08-21: the fact was previously sourced from
    openai.com/business-data/, which mentions a DPA exists but isn't the
    document itself. Re-pointed to the actual DPA (v.010126), read directly
    — openai.com/policies/data-processing-addendum/ returns HTTP 403 to a
    robot (issue #6), but this PDF, served from a different subdomain,
    doesn't.
    OPENAI'S DPA IS EXPLICITLY PROCESSOR-ONLY — checked after Twilio's DPA
    surfaced the controller-role question, then re-asked across every
    dpa_eu entry (see METHODOLOGY.md, "Comparability across the matrix").
    Section 1.1: "OpenAI acts as a Data Processor on the Customer's
    behalf." Section 1.2: "OpenAI will only Process Customer Data for the
    purposes of delivering the Services to Customer pursuant to the
    Agreement and this DPA." No clause anywhere in the document reserves a
    controller role for OpenAI's own purposes — unlike Mistral (model
    training, analytics) or AssemblyAI (billing, fraud prevention,
    compliance), both of which name themselves "Controller" for specific
    activities in their own DPAs. This is a genuine difference between
    providers, not an artifact of one being searched harder than another:
    all three DPAs were read for exactly this question.
