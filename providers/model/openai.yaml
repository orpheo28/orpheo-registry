data_residency:
  value: [us, eu, uk, jp, ca, kr, sg, au, in, ae]
  verified_at: 2026-08-13
  human_reviewed_at: 2026-08-13
  source_url: https://openai.com/business-data/
  confidence: medium
  note: >
    CONFIRMED BY A HUMAN REREADING on 2026-08-13, the page being closed to
    automated readers (HTTP 403). The reader established two distinct things,
    and the second is the one editors miss:
    residency AT REST in these regions, for eligible customers of ChatGPT
    Enterprise, ChatGPT Edu, ChatGPT for Healthcare and the API platform;
    and, separately, that API customers can explicitly select the United States
    or Europe for PROCESSING — GPU inference and non-GPU processing alike.
    Storage and processing are two guarantees, not one. A provider can hold data
    at rest in a region and compute elsewhere, and only the second is affected by
    where the model runs.
    NO QUOTE RECORDED, so the level is capped at medium: the sentence read is the
    French localisation of the page, and this registry quotes documents in the
    language of the URL it publishes. Recording an English back-translation as
    verbatim would fabricate the one thing a quote exists to prove.

# dpa_eu — RETIRÉ le 2026-08-13, après relecture humaine de la source
#
#   Le fait était enregistré `true` depuis openai.com/business-data. La relecture
#   manuelle de la page établit qu'elle propose « un Accord relatif au traitement
#   des données » — un DPA GÉNÉRIQUE — et qu'elle ne dit nulle part « DPA
#   européen ». Le RGPD y est mentionné séparément, sous la forme d'une aide à la
#   conformité, ce qui n'est pas la même affirmation.
#
#   Or ce champ ne demande pas « un DPA existe-t-il ». Il demande un accord de
#   sous-traitance EUROPÉEN, et c'est ainsi que la matrice le lit — à côté de
#   Mistral et d'AssemblyAI, dont les DPA citent nommément le règlement 2016/679
#   et les clauses contractuelles types de la décision 2021/914. Publier `true`
#   pour OpenAI dans cette colonne aurait mis sur la même ligne un accord dont on
#   sait qu'il porte les clauses et un accord dont on sait seulement qu'il est
#   proposé.
#
#   Un DPA proposé n'est pas un DPA aux clauses contractuelles types. Le fait
#   redevient donc une inconnue plutôt qu'un `true` affaibli : « non renseigné »
#   dit ce qu'on sait, « oui » dirait ce qu'on ne sait pas.
#
#   Pour le rétablir : le document lui-même, et la clause qui vise les CCT.

