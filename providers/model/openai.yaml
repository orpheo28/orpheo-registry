provider_id: openai
service_name: "OpenAI API"
entity: openai
entity_name: "OpenAI"
layer: model
jurisdiction: US
models: [gpt-5.2, gpt-5.2-mini, o4]

baa_available:
  value: true
  verified_at: 2026-08-13
  human_reviewed_at: 2026-08-13
  source_url: https://help.openai.com/en/articles/8660679-how-can-i-get-a-business-associate-agreement-baa-with-openai
  confidence: high
  note: >
    BAA signable for the API Platform and for ChatGPT for Healthcare. An
    enterprise agreement is NOT required to sign a BAA on the API — unlike
    ChatGPT Enterprise/Edu, which is reserved for sales-managed accounts.
    ChatGPT Business is not eligible.
    Web search with direct internet access is NOT HIPAA-eligible and is not
    covered by the BAA; in cache-only mode it is, but only with a key from a
    ZDR project inside a ZDR organization.
    SOURCE CHANGED on 2026-08-13: the fact was indeed on
    openai.com/enterprise-privacy, but behind a collapsed FAQ — so not
    re-verifiable by a third party without a gesture. The recorded source is now
    the page that states it in its main text.

no_training_commitment:
  value: true
  verified_at: 2026-08-13
  source_url: https://openai.com/enterprise-privacy/
  confidence: high
  note: >
    Data submitted through the API, ChatGPT Enterprise and ChatGPT Team is not
    used to train the models — stated in direct text on the page. Consumer tiers
    (Free, Plus) have a different default and are not covered here.

default_retention:
  value: "30 days"
  verified_at: 2026-08-13
  source_url: https://openai.com/enterprise-privacy/
  confidence: high
  note: >
    Retention of up to 30 days to provide the service and detect abuse, except
    for the endpoints and features excluded in the platform documentation.
    Deletion after 30 days unless a legal obligation applies.

zero_retention_option:
  value: true
  verified_at: 2026-08-13
  source_url: https://developers.openai.com/api/docs/guides/your-data
  confidence: high
  note: >
    ZDR on eligible endpoints, subject to approval and to a qualifying use case.
    Controls are configurable at the organization and project level.
    PUBLISHED RESERVATION: OpenAI reserves the right to make a model ineligible
    for ZDR for a given customer during a severe risk investigation, with prior
    written notice.

data_residency:
  value: [us, eu, uk, jp, ca, kr, sg, au, in, ae]
  verified_at: 2026-08-13
  source_url: https://openai.com/business-data/
  confidence: high
  note: >
    Residency AT REST in these regions for eligible customers. In addition,
    in-region GPU inference is available in the US and in Europe; API customers
    can explicitly select US or Europe for processing (GPU and non-GPU) on
    supported endpoints.

dpa_eu:
  value: true
  verified_at: 2026-08-13
  source_url: https://openai.com/business-data/
  confidence: high
