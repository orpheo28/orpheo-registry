baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://aws.amazon.com/compliance/hipaa-eligible-services-reference/
  confidence: medium
  note: >
    CE QUE CETTE PAGE ATTESTE, ET CE QU'ELLE N'ATTESTE PAS. Elle établit
    l'éligibilité du SERVICE Bedrock, pas celle du MODÈLE appelé à travers lui.
    Un lecteur conclura spontanément l'inverse, et c'est faux : ce qu'un
    éditeur de modèle s'engage à faire des données — entraînement, rétention —
    relève d'un autre régime, chez un autre acteur, et n'est pas dans cette
    page. C'est exactement pourquoi les autres faits de ce fichier restent
    vides : on ne déduit pas un engagement de non-entraînement d'une
    éligibilité HIPAA.
    UNE EXCLUSION AU NIVEAU DU MODÈLE Y FIGURE TOUT DE MÊME : la ligne exacte
    est « Amazon Bedrock [excluding Fable and Mythos models] », annotation
    entre crochets dans la liste alphabétique des services. Un éditeur qui
    appelle l'un de ces deux modèles depuis Bedrock sort de la couverture sans
    changer de fournisseur ni de console.
    LE BAA EST UN PRÉALABLE, PAS UNE CONSÉQUENCE. La note de bas de page est
    explicite : « you agree not to use these HIPAA Eligible Services for any
    purpose or in any manner involving Protected Health Information without
    first entering into an AWS business associate agreement ». L'éligibilité
    ne couvre rien tant que l'accord n'est pas signé.
    L'éligibilité reste en outre soumise au modèle de responsabilité partagée :
    « Customers still must configure these services consistent with HIPAA
    requirements ». Cette page est une référence de conformité publiée par AWS,
    pas le contrat lui-même : d'où confidence medium.

