baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://aws.amazon.com/compliance/hipaa-eligible-services-reference/
  confidence: medium
  note: >
    Bedrock figure parmi les services éligibles HIPAA, mais AVEC UNE EXCLUSION
    AU NIVEAU DU MODÈLE : la mention exacte est « Amazon Bedrock [excluding
    Fable and Mythos models] ». Un éditeur qui appelle l'un de ces modèles
    depuis Bedrock sort de la couverture sans changer de fournisseur ni de
    console — c'est le genre de rupture qu'aucune revue de sécurité ne montre.
    L'éligibilité est en outre soumise au modèle de responsabilité partagée :
    « Customers still must configure these services consistent with HIPAA
    requirements ». Le BAA lui-même est un accord distinct, à exécuter avec AWS.
    Cette page est une référence de conformité publiée par AWS, pas le contrat :
    d'où confidence medium.

