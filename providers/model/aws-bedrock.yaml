baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://aws.amazon.com/compliance/hipaa-eligible-services-reference/
  confidence: medium
  note: >
    WHAT THIS PAGE ESTABLISHES, AND WHAT IT DOESN'T. It establishes the
    eligibility of the Bedrock SERVICE, not that of the MODEL called through
    it. A reader will spontaneously conclude the opposite, and that's wrong:
    what a model publisher commits to doing with data — training, retention
    — falls under a different regime, at a different actor, and isn't on
    this page. That's exactly why the other facts in this file stay empty:
    a no-training commitment isn't inferred from a HIPAA eligibility.
    A MODEL-LEVEL EXCLUSION IS ON IT ANYWAY: the exact line is "Amazon
    Bedrock [excluding Fable and Mythos models]," a bracketed annotation in
    the alphabetical list of services. A buyer who calls either of those two
    models through Bedrock falls out of coverage without changing provider
    or console.
    THE BAA IS A PREREQUISITE, NOT A CONSEQUENCE. The footnote is explicit:
    "you agree not to use these HIPAA Eligible Services for any purpose or
    in any manner involving Protected Health Information without first
    entering into an AWS business associate agreement." Eligibility covers
    nothing until the agreement is signed.
    Eligibility also remains subject to the shared-responsibility model:
    "Customers still must configure these services consistent with HIPAA
    requirements." This page is a compliance reference published by AWS,
    not the contract itself: hence confidence medium.

