  confidence: medium
  note: >
    WHAT THIS PAGE ESTABLISHES, AND WHAT IT DOES NOT. It establishes the
    eligibility of the Bedrock SERVICE, not that of the MODEL called through it.
    A reader will assume the opposite, and that assumption is wrong: what a model
    provider commits to regarding training and retention is a separate regime, at
    a different company, and is not on this page. That is exactly why the other
    facts in this file are left empty — a no-training commitment is not implied
    by HIPAA eligibility.
    A MODEL-LEVEL EXCLUSION DOES APPEAR HERE: the exact line reads « Amazon
    Bedrock [excluding Fable and Mythos models] », a bracketed annotation inside
    the alphabetical service list. An editor calling either of those two models
    through Bedrock leaves the coverage without changing provider or console.
    THE BAA IS A PREREQUISITE, NOT A CONSEQUENCE. The footnote is explicit:
    « you agree not to use these HIPAA Eligible Services for any purpose or in
    any manner involving Protected Health Information without first entering into
    an AWS business associate agreement. » Eligibility covers nothing until the
    agreement is signed.
    Eligibility also remains subject to the shared responsibility model:
    « Customers still must configure these services consistent with HIPAA
    requirements. » This is a compliance reference published by AWS, not the
    contract itself — hence medium confidence.

