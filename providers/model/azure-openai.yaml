provider_id: azure-openai
service_name: "Azure OpenAI Service"
entity: microsoft
entity_name: "Microsoft"
layer: model
models: [gpt-5.2, gpt-5.2-mini, o4]

no_training_commitment:
  value: true
  verified_at: 2026-08-13
  source_url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
  confidence: medium
  note: >
    Exact wording: prompts, completions, embeddings and training data « are NOT
    available to OpenAI or other providers of Models sold by Azure », « are NOT
    used by providers of Models sold by Azure to improve their models or
    services », and « are NOT used to train any generative AI foundation models
    without your permission or instruction ».
    THE QUALIFIER MATTERS: the last clause is conditional — « without your
    permission or instruction » — not an absolute prohibition.
    Microsoft states that processing is governed by the Products and Services
    Data Protection Addendum, which is the contractual document; this page is
    documentation, hence medium confidence.

zero_retention_option:
  value: true
  verified_at: 2026-08-13
  source_url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
  confidence: medium
  note: >
    Through « modified abuse monitoring », subject to approval and limited to
    managed customers: « If the customer has been approved for modified abuse
    monitoring, the data storage and human review process described above is not
    performed. »
    RESERVATIONS: automated review may still run, and if it detects severe or
    recurring abuse the customer may face access limitations. Preview features
    may apply different practices.

data_residency:
  value: [customer-designated Azure geography]
  verified_at: 2026-08-13
  source_url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
  confidence: medium
  note: >
    « Prompts and responses are processed within the customer-specified
    geography » — EXCEPT for Global and DataZone deployment types.
    DOCUMENTED CONFLICT: a Global deployment processes requests in any geography
    where the model is deployed; a DataZone deployment, anywhere within the zone.
    Data at rest stays in the designated geography in both cases — it is the
    PROCESSING that leaves. An editor who believes they picked their region by
    selecting a Global deployment is mistaken.

