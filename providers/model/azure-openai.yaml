provider_id: azure-openai
legal_entity: Microsoft Corporation
layer: model
jurisdiction: US
models: [gpt-5.2, gpt-5.2-mini, o4]

no_training_commitment:
  value: true
  holds_by_default: true
  verified_at: 2026-08-21
  source_url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
  confidence: medium
  note: >
    Exact wording: inputs, outputs, embeddings, and training data "are NOT
    available to OpenAI or other providers of Models sold by Azure," "are
    NOT used by providers of Models sold by Azure to improve their models or
    services," and "are NOT used to train any generative AI foundation
    models without your permission or instruction."
    WHAT ACTUALLY MATTERS HERE: the last clause is conditional — "without
    your permission or instruction" — not an absolute prohibition.
    Microsoft states that processing is governed by the Products and
    Services Data Protection Addendum, which is the contractual document;
    this page is documentation, hence confidence medium.
    HOLDS_BY_DEFAULT IS TRUE HERE because the conditional runs the OTHER
    way: it's Microsoft who'd need the customer's permission to train, not
    the customer who needs to act to be covered. Nothing to configure to
    get this commitment — it's what happens from ordinary use.

zero_retention_option:
  value: true
  holds_by_default: false
  verified_at: 2026-08-21
  source_url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
  confidence: medium
  note: >
    Through the "modified abuse monitoring" mechanism, subject to approval
    and reserved for managed customers: "If the customer has been approved
    for modified abuse monitoring, the data storage and human review process
    described above is not performed."
    CAVEATS: an AUTOMATED review can still run, and if it detects severe or
    recurring abuse the customer may face access restrictions. Preview
    features may apply different practices.

data_residency:
  value: [customer-specified Azure geography]
  holds_by_default: false
  verified_at: 2026-08-21
  source_url: https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/data-privacy
  confidence: medium
  note: >
    "Prompts and responses are processed within the customer-specified
    geography," EXCEPT for the Global and DataZone deployment types.
    DOCUMENTED CONFLICT: a "Global" deployment processes requests in
    whatever geography the model is deployed to; a "DataZone" deployment in
    any geography within the zone. Storage AT REST stays within the
    designated geography in both cases — it's PROCESSING that leaves it. A
    buyer who thinks they've chosen their region by picking a Global
    deployment is wrong.
    HOLDS_BY_DEFAULT IS FALSE because "customer-specified" is the source's
    own word — the guarantee follows from an affirmative selection made at
    deployment, not from merely using the service.

# baa_available — NOT DOCUMENTED
#   Microsoft offers a HIPAA BAA through its Product Terms, but the page read
#   doesn't establish coverage for Azure OpenAI specifically. Not to be inferred.

# default_retention — NOT DOCUMENTED
#   The retention period for abuse-monitoring data is documented on another
#   page, not read.

# dpa_eu — NOT DOCUMENTED
#   The Data Protection Addendum is cited as governing processing, but its
#   canonical URL hasn't been resolved and its content hasn't been read.
