baa_available:
  value: true
  verified_at: 2026-08-13
  source_url: https://aws.amazon.com/compliance/hipaa-eligible-services-reference/
  confidence: medium
  note: >
    « Amazon Connect » and « Amazon Chime SDK » both appear in the eligible list
    with no annotation and no exclusion — unlike Bedrock on the same page, which
    carries a model exclusion in brackets, and like S3 and Transcribe, which
    carry none.
    THE BAA IS A PREREQUISITE: « you agree not to use these HIPAA Eligible
    Services for any purpose or in any manner involving Protected Health
    Information ... without first entering into an AWS business associate
    agreement ».
    ELIGIBILITY IS NOT CONFIGURATION: « Customers still must configure these
    services consistent with HIPAA requirements. » On a telephony service that
    records calls and transcribes them, that sentence carries most of the work.
    Compliance reference published by AWS, not the contract: medium confidence.

