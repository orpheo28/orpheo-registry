name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Le build REFUSE de produire un site sans nom, et sans valeur de repli — un
  # repli est un nom en dur, simplement plus discret (CLAUDE.md). La CI doit
  # donc le fournir comme n'importe quel environnement de build.
  PRODUCT_NAME: Orpheo
  SITE_URL: https://orpheo-registry.workers.dev

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # Le lockfile committé a été relu : la politique d'ancienneté gouverne
          # les résolutions NOUVELLES, pas la reproduction d'un état déjà validé.
          NPM_CONFIG_TRUST_LOCKFILE: "true"
      - run: pnpm verify

      # `METHODOLOGY.md` est GÉNÉRÉ par le build depuis la même source que la
      # page publique. S'il diffère de ce qui est committé, les deux versions
      # ont divergé — et c'est toujours la version publique qui aurait tort,
      # puisque c'est elle que personne ne relit dans une PR.
      - name: La méthodologie committée correspond-elle à celle publiée ?
        run: |
          if ! git diff --quiet -- METHODOLOGY.md; then
            echo "METHODOLOGY.md a divergé de site/methodologie.ts."
            echo "Lancez pnpm run build et committez le résultat."
            git --no-pager diff -- METHODOLOGY.md
            exit 1
          fi

  sources:
    name: sources ajoutées
    runs-on: ubuntu-latest
    # Sur une pull request seulement. Sur `main`, une source morte n'est plus une
    # faute de contribution mais un fait du monde : c'est le contrôle
    # hebdomadaire qui la traite, en faisant redescendre le fait plutôt qu'en
    # bloquant un dépôt que personne n'a cassé.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_TRUST_LOCKFILE: "true"

      - name: Contrôler les sources que cette PR ajoute ou modifie
        run: |
          # Seules les lignes AJOUTÉES du diff sur providers/ : une source déjà
          # présente et déjà morte n'est pas le problème de cette PR.
          URLS=$(git diff "origin/${{ github.base_ref }}...HEAD" -- providers/ \
                 | grep '^+' | grep -oE 'https?://[^ "]+' | sort -u | tr '\n' ' ')
          echo "Sources ajoutées ou modifiées : ${URLS:-aucune}"
          node scripts/check-sources.ts --changed $URLS
