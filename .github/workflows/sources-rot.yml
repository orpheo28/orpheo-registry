name: Fraîcheur des sources

# Hebdomadaire. Une source qui meurt entre deux revues ne casse rien : elle fait
# redescendre le fait à NON VÉRIFIÉ sur le site, avec sa dernière date connue
# (INV-11, INV-12). Le registre doit dire qu'il ne sait plus, pas se taire.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rot:
    name: fraîcheur des sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_TRUST_LOCKFILE: "true"

      - name: Contrôler toutes les sources
        run: node scripts/check-sources.ts --all

      # L'état passe par une pull request et non par une poussée directe : il
      # entre dans l'historique public du registre, qui est ce qui fait foi, et
      # une relecture humaine reste nécessaire pour retrouver le document.
      - name: Ouvrir une PR si l'état a changé
        # La logique vit dans scripts/open-pr-if-changed.sh : un `run:` inline
        # ne peut pas être exercé par un test. Voir
        # scripts/open-pr-if-changed.test.ts, qui fabrique un changement et
        # exige que la PR s'ouvre — pas seulement que le chemin « rien n'a
        # changé » se termine proprement.
        run: bash scripts/open-pr-if-changed.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
